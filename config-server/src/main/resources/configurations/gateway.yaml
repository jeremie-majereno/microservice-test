spring:
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: account-service
              uri: http://localhost:8050
              predicates:
                - Path=/api/v1/accounts/**

            - id: customer-service
              uri: http://localhost:8060
              predicates:
                - Path=/api/v1/customers/**

            - id: transaction-service
              uri: http://localhost:8070
              predicates:
                - Path=/api/v1/transactions/**
      discovery:
        locator:
          enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    gateway:
      access: unrestricted

server:
  port: 8882